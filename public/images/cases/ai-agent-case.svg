<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Yapay zeka ajanı görseli">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#12121f"/>
    </linearGradient>
    <radialGradient id="g1" cx="22%" cy="18%" r="55%">
      <stop offset="0" stop-color="#7cff92" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7cff92" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="82%" cy="86%" r="55%">
      <stop offset="0" stop-color="#8464ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8464ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cff92"/>
      <stop offset="1" stop-color="#8464ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#g1)"/>
  <rect width="1600" height="900" fill="url(#g2)"/>

  <!-- connecting nodes -->
  <g stroke="url(#accent)" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M800 450 L520 250"/><path d="M800 450 L1080 250"/>
    <path d="M800 450 L470 560"/><path d="M800 450 L1130 560"/>
    <path d="M800 450 L800 700"/>
  </g>
  <g fill="#0e0e1b" stroke="url(#accent)" stroke-width="2">
    <circle cx="520" cy="250" r="22"/><circle cx="1080" cy="250" r="22"/>
    <circle cx="470" cy="560" r="22"/><circle cx="1130" cy="560" r="22"/>
    <circle cx="800" cy="700" r="22"/>
  </g>

  <!-- central chip -->
  <rect x="690" y="340" width="220" height="220" rx="34" fill="#0e0e1b" stroke="url(#accent)" stroke-width="3"/>
  <g stroke="url(#accent)" stroke-width="2" stroke-opacity="0.6">
    <line x1="690" y1="395" x2="650" y2="395"/><line x1="690" y1="450" x2="650" y2="450"/><line x1="690" y1="505" x2="650" y2="505"/>
    <line x1="910" y1="395" x2="950" y2="395"/><line x1="910" y1="450" x2="950" y2="450"/><line x1="910" y1="505" x2="950" y2="505"/>
    <line x1="745" y1="340" x2="745" y2="300"/><line x1="800" y1="340" x2="800" y2="300"/><line x1="855" y1="340" x2="855" y2="300"/>
    <line x1="745" y1="560" x2="745" y2="600"/><line x1="800" y1="560" x2="800" y2="600"/><line x1="855" y1="560" x2="855" y2="600"/>
  </g>
  <!-- bot face -->
  <rect x="742" y="392" width="116" height="92" rx="20" fill="none" stroke="url(#accent)" stroke-width="4"/>
  <circle cx="775" cy="438" r="10" fill="#7cff92"/>
  <circle cx="825" cy="438" r="10" fill="#8464ff"/>
  <line x1="800" y1="370" x2="800" y2="392" stroke="url(#accent)" stroke-width="4"/>
  <circle cx="800" cy="366" r="7" fill="#7cff92"/>

  <text x="800" y="800" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="34" letter-spacing="8" fill="#E9DFFF" fill-opacity="0.85" font-weight="600">YAPAY ZEKA AJANI</text>
</svg>
