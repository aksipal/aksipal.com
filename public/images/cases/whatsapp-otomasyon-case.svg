<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="WhatsApp otomasyonu görseli">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#12121f"/>
    </linearGradient>
    <radialGradient id="g1" cx="22%" cy="18%" r="55%">
      <stop offset="0" stop-color="#7cff92" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7cff92" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="82%" cy="86%" r="55%">
      <stop offset="0" stop-color="#8464ff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8464ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cff92"/>
      <stop offset="1" stop-color="#8464ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#g1)"/>
  <rect width="1600" height="900" fill="url(#g2)"/>

  <!-- phone frame -->
  <rect x="620" y="170" width="360" height="560" rx="46" fill="#0e0e1b" stroke="url(#accent)" stroke-width="3"/>
  <rect x="744" y="190" width="112" height="14" rx="7" fill="#ffffff" fill-opacity="0.12"/>

  <!-- incoming bubble -->
  <rect x="660" y="250" width="210" height="70" rx="20" fill="#ffffff" fill-opacity="0.07"/>
  <rect x="684" y="276" width="150" height="10" rx="5" fill="#ffffff" fill-opacity="0.28"/>
  <!-- outgoing accent bubble -->
  <rect x="730" y="350" width="210" height="70" rx="20" fill="#7cff92" fill-opacity="0.16" stroke="#7cff92" stroke-opacity="0.5"/>
  <rect x="754" y="376" width="130" height="10" rx="5" fill="#7cff92" fill-opacity="0.6"/>
  <!-- incoming bubble 2 -->
  <rect x="660" y="450" width="180" height="60" rx="20" fill="#ffffff" fill-opacity="0.07"/>
  <rect x="684" y="473" width="120" height="10" rx="5" fill="#ffffff" fill-opacity="0.28"/>
  <!-- outgoing with double tick -->
  <rect x="730" y="540" width="210" height="70" rx="20" fill="#8464ff" fill-opacity="0.18" stroke="#8464ff" stroke-opacity="0.5"/>
  <rect x="754" y="566" width="110" height="10" rx="5" fill="#cdbcff"/>
  <path d="M892 588 l10 10 l18 -20 M906 588 l10 10 l18 -20" fill="none" stroke="#7cff92" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- automation gear orbiting -->
  <g transform="translate(1120 420)">
    <circle r="86" fill="#0e0e1b" stroke="url(#accent)" stroke-width="3"/>
    <g fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round">
      <circle r="40"/>
      <line x1="0" y1="-40" x2="0" y2="-62"/><line x1="0" y1="40" x2="0" y2="62"/>
      <line x1="-40" y1="0" x2="-62" y2="0"/><line x1="40" y1="0" x2="62" y2="0"/>
      <line x1="-28" y1="-28" x2="-44" y2="-44"/><line x1="28" y1="28" x2="44" y2="44"/>
      <line x1="28" y1="-28" x2="44" y2="-44"/><line x1="-28" y1="28" x2="-44" y2="44"/>
    </g>
  </g>
  <path d="M980 440 H1034" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="6 8"/>

  <text x="800" y="800" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="34" letter-spacing="8" fill="#E9DFFF" fill-opacity="0.85" font-weight="600">WHATSAPP OTOMASYONU</text>
</svg>
